name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test
        run: ./mvnw verify

      - name: Set image tag
        id: tag
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/guesthouse-booking:${{ steps.tag.outputs.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/guesthouse-booking:latest

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying ${{ secrets.DOCKERHUB_USERNAME }}/guesthouse-booking:${{ steps.tag.outputs.sha }} to staging"
          npm install -g @railway/cli
          railway redeploy --service ${{ secrets.RAILWAY_STAGING_SERVICE_ID }} --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_production == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "Deploying ${{ secrets.DOCKERHUB_USERNAME }}/guesthouse-booking:${{ steps.tag.outputs.sha }} to production"
          npm install -g @railway/cli
          railway redeploy --service ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }} --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
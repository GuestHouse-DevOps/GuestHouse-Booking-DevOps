name: CI/CD — Booking Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Full commit SHA on main to roll production back to'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: ./mvnw test

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Log In to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        run: .github/scripts/railway-deploy.sh "$SERVICE_ID" "$IMAGE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_STAGING_SERVICE_ID }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    # The production environment requires a reviewer, so this job waits for approval.
    if: ${{ !cancelled() && (needs.deploy-staging.result == 'success' || github.event_name == 'workflow_dispatch') }}
    environment: production

    steps:
      - name: Check SHA
        run: |
          if ! [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a full 40-character commit SHA"
            exit 1
          fi
        env:
          IMAGE_SHA: ${{ inputs.image_sha || github.sha }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        run: .github/scripts/railway-deploy.sh "$SERVICE_ID" "$IMAGE"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_PRODUCTION_SERVICE_ID }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:${{ inputs.image_sha || github.sha }}

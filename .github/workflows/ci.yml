name: CI/CD — Booking Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to production?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests
        run: ./mvnw test

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Log In to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:latest
            ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_production == 'true'

    steps:
      - name: Production deploy triggered
        run: |
          echo "Production deploy triggered manually"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/guesthouse-booking-service:${{ github.sha }}"
          echo "Deploy this image to Railway production manually or via Railway CLI"
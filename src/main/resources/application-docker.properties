server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

customer.service.url=${CUSTOMER_SERVICE_URL}
customer.service.connect-timeout=${CUSTOMER_SERVICE_CONNECT_TIMEOUT:2s}
customer.service.read-timeout=${CUSTOMER_SERVICE_READ_TIMEOUT:10s}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

management.endpoint.health.group.liveness.include=db,ping
management.endpoint.health.group.liveness.show-components=always

logging.level.org.nackademin.guesthousebookingsystem=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

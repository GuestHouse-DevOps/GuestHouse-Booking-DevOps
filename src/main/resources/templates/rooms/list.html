<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">

<head>
    <meta charset="UTF-8">
    <title>Rum</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            GuestHouse
        </a>

        <div class="navbar-nav">

            <a class="nav-link" th:href="@{/}">
                Startsida
            </a>

            <a class="nav-link" th:href="@{/customers}">
                Kunder
            </a>

            <a class="nav-link active" th:href="@{/rooms}">
                Rum
            </a>

            <a class="nav-link" th:href="@{/bookings}">
                Bokningar
            </a>


        </div>

    </div>

</nav>

<div class="container mt-4">

    <h1 class="mb-4">
        Rum
    </h1>

    <div th:if="${success}"
         class="alert alert-success alert-dismissible fade show">

        <span th:text="${success}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div th:if="${error}"
         class="alert alert-danger alert-dismissible fade show">

        <span th:text="${error}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <div class="row">

        <div class="col-md-4">

            <div class="card p-4 shadow-sm mb-4">

                <h3 th:text="${editMode} ? 'Redigera rum' : 'Lägg till rum'">
                </h3>

                <form th:action="${editMode} ?
                      @{/rooms/update/{id}(id=${room.id})} :
                      @{/rooms/save}"
                      th:object="${room}"
                      method="post">

                    <div class="mb-3">

                        <label>Rumsnummer</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{roomNumber}"
                               min="1"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Rumstyp</label>

                        <select class="form-control"
                                th:field="*{roomType}">

                            <option th:each="type : ${roomTypes}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label>Extrasängar</label>

                        <select class="form-control"
                                th:field="*{extraBeds}">

                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>

                        </select>

                    </div>

                    <button type="submit"
                            th:class="${editMode} ?
                            'btn btn-warning w-100' :
                            'btn btn-primary w-100'">

                        <span th:text="${editMode} ? 'Uppdatera rum' : 'Spara rum'">
                        </span>

                    </button>

                    <a th:if="${editMode}"
                       th:href="@{/rooms}"
                       class="btn btn-secondary w-100 mt-2">

                        Avbryt
                    </a>

                </form>

            </div>

            <div class="card p-4 shadow-sm">

                <h3>Sök lediga rum</h3>

                <form th:action="@{/rooms/search}"
                      method="get">

                    <div class="mb-3">

                        <label>Incheckning</label>

                        <input type="date"
                               name="startDate"
                               class="form-control"
                               th:value="${startDate}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Utcheckning</label>

                        <input type="date"
                               name="endDate"
                               class="form-control"
                               th:value="${endDate}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Antal gäster</label>

                        <input type="number"
                               name="guests"
                               class="form-control"
                               min="1"
                               max="4"
                               th:value="${guests != null} ? ${guests} : 1"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100">

                        Sök
                    </button>

                </form>

            </div>

        </div>

        <div class="col-md-8">

            <div th:if="${searchPerformed}" class="card p-4 shadow-sm mb-4">

                <h3 class="mb-3">Sökresultat</h3>

                <div th:if="${searchError}"
                     class="alert alert-danger">

                    <span th:text="${searchError}"></span>

                </div>

                <div th:if="${availableRooms == null or availableRooms.isEmpty()}"
                     class="alert alert-info">

                    Inga lediga rum hittades för valda datum och antal gäster.

                </div>

                <table th:unless="${availableRooms == null or availableRooms.isEmpty()}"
                       class="table table-bordered table-hover">

                    <thead class="table-success">

                    <tr>
                        <th>Rumsnummer</th>
                        <th>Typ</th>
                        <th>Extrasängar</th>
                        <th>Åtgärd</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="r : ${availableRooms}">

                        <td th:text="${r.roomNumber}"></td>

                        <td th:text="${r.roomType}"></td>

                        <td th:text="${r.extraBeds}"></td>

                        <td>
                            <a th:href="@{/bookings}"
                               class="btn btn-sm btn-success">
                                Boka
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <div class="card p-4 shadow-sm">

                <h3 class="mb-3">
                    Alla rum
                </h3>

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Rumsnummer</th>
                        <th>Typ</th>
                        <th>Extrasängar</th>
                        <th>Åtgärd</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="r : ${rooms}">

                        <td th:text="${r.id}"></td>

                        <td th:text="${r.roomNumber}"></td>

                        <td th:text="${r.roomType}"></td>

                        <td th:text="${r.extraBeds}"></td>

                        <td>

                            <a th:href="@{/rooms/edit/{id}(id=${r.id})}"
                               class="btn btn-sm btn-primary">

                                Edit
                            </a>

                            <a th:href="@{/rooms/delete/{id}(id=${r.id})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Är du säker på att du vill ta bort rummet?')">

                                Delete
                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

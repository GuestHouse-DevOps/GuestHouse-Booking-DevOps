<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="sv">

<head>
    <meta charset="UTF-8">
    <title>GuestHouse Booking System</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            GuestHouse
        </a>

        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/}">
                Startsida
            </a>

            <a class="nav-link" th:href="@{/customers}">
                Kunder
            </a>

            <a class="nav-link" th:href="@{/rooms}">
                Rum
            </a>

            <a class="nav-link" th:href="@{/bookings}">
                Bokningar
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="text-center mb-5">

        <h1>GuestHouse Booking System</h1>

        <p class="text-muted">
            Hantera kunder, rum och bokningar
        </p>

    </div>

    <div class="row justify-content-center">

        <div class="col-md-3">

            <div class="card mb-4">

                <div class="card-body text-center">

                    <h4>Kunder</h4>

                    <p>
                        Registrera och hantera kunder.
                    </p>

                    <a th:href="@{/customers}"
                       class="btn btn-primary">
                        Gå till kunder
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card mb-4">

                <div class="card-body text-center">

                    <h4>Rum</h4>

                    <p>
                        Lägg till och hantera rum.
                    </p>

                    <a th:href="@{/rooms}"
                       class="btn btn-primary">
                        Gå till rum
                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card mb-4">

                <div class="card-body text-center">

                    <h4>Bokningar</h4>

                    <p>
                        Skapa och hantera bokningar.
                    </p>

                    <a th:href="@{/bookings}"
                       class="btn btn-primary">
                        Gå till bokningar
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
